<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--bone)}
.wrap{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.lbl{font-size:0.75rem;font-weight:600;letter-spacing:.04em;color:var(--ink-muted);text-transform:uppercase;width:100%;margin-top:8px}
</style><style>.btn{font-family:var(--font-body);font-size:1rem;font-weight:600;border:0;border-radius:var(--radius-md);padding:12px 20px;min-height:44px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.p{background:var(--forest-900);color:var(--ink-inverse)}.p:hover{background:var(--forest-800)}
.a{background:var(--lime-400);color:var(--forest-900)}
.s{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--border)}
.g{background:transparent;color:var(--forest-900)}
.d{background:var(--danger);color:#fff}
.dis{opacity:.4;cursor:not-allowed}.sm{font-size:0.875rem;min-height:36px;padding:8px 14px;border-radius:var(--radius-sm)}
.dark{background:var(--forest-900);padding:16px;border-radius:var(--radius-lg);display:flex;gap:12px}</style></head><body><div class="wrap"><div class="lbl">Na svetloj pozadini</div>
<button class="btn p">Proknjiži uplatu</button><button class="btn s">Izmeni</button><button class="btn g">Preskoči</button><button class="btn d">Storniraj fakturu</button><button class="btn p dis">Nedostupno</button><button class="btn p sm">Malo dugme</button>
<div class="lbl">Na tamnoj pozadini</div><div class="dark"><button class="btn a">Nova faktura</button><button class="btn g" style="color:var(--ink-inverse)">Kasnije</button></div></div></body></html>
